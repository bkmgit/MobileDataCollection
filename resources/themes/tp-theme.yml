extends: base
page:
  layout: landscape
  margin: [0.5in, 0.75in, 0.5in, 0.75in]
  size: Measurement[12,16]
  numbering:
    start-at: title
footer:
  height: 30
  recto:
    left:
      content: ''
    right:
      content: '{page-number} of {page-count}'
  verso:
    left:
      content: ''
    right:
      content: '{page-number} of {page-count}'
font:
  catalog:
    merge: true 
    Intel One Mono:
      normal: IntelOneMono-Regular.ttf
      italic: IntelOneMono-Italic.ttf
      bold: IntelOneMono-Bold.ttf
      bold_italic: IntelOneMono-BoldItalic.ttf
base:
  font-color: #333333
  font-family: Intel One Mono
  font-size: 19
  line-height-length: 17
  line-height: $base-line-height-length / $base-font-size
role:
  removed:
    font-style: italic
    text-decoration: line-through
    text-decoration-color: #FF0000
heading:
  font-color: #262626
  font-size: 25
  h1-font-size: 24
  h2-font-size: 22
  h3-font-size: 21
  font-style: bold
  line-height: 1.2
  margin-bottom: 10
title-page: false
link:
  font-color: #002FA7
list:
  indent: $base-font-size * 1.5
